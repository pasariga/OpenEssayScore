name: Research package CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install '.[test]' build twine
      - run: python -m pytest -q
      - run: python examples/synthetic_demo.py
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Install wheel in a fresh virtual environment
        run: |
          python -m venv "${RUNNER_TEMP}/wheel-check"
          "${RUNNER_TEMP}/wheel-check/bin/python" -m pip install dist/*.whl
          "${RUNNER_TEMP}/wheel-check/bin/openessayscore" --help
