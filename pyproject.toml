[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openessayscore"
version = "0.1.0"
description = "Research Chinese essay scoring, CPU serving and review guardrails"
requires-python = ">=3.11,<3.13"
dependencies = ["numpy==1.26.4", "scipy==1.12.0", "scikit-learn==1.8.0", "joblib==1.4.2", "pydantic>=2,<3", "psutil>=7,<8", "jsonschema>=4,<5"]

[project.scripts]
openessayscore = "openessayscore.__main__:main"

[project.optional-dependencies]
http = ["fastapi==0.128.0", "uvicorn==0.40.0"]
test = ["fastapi==0.128.0", "uvicorn==0.40.0", "pytest>=9,<10", "httpx==0.28.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"openessayscore.service" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests", "src/openessayscore/service/test_service.py"]
